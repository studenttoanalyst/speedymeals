<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedy Meals - Customer Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex justify-center items-center antialiased">
  <!-- Mobile Container -->
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col justify-between shadow-2xl relative overflow-hidden">
    
    <!-- Top Status Bar Simulation -->
    <div class="pt-3 px-6 flex justify-between items-center text-xs font-semibold text-slate-700 select-none">
      <span class="">9:41</span>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-[11px]"></i>
        <i class="fa-solid fa-wifi text-[11px]"></i>
        <i class="fa-solid fa-battery-full text-[13px]"></i>
      </div>
    </div>

    <!-- Header Navigation -->
    <div class="px-5 pt-3 flex items-center justify-between">
      <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-100/80 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-all duration-200 active:scale-95">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <div class="inline-flex items-center gap-1.5 bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs font-semibold border border-red-100">
        <i class="fa-solid fa-burger text-[11px]"></i>
        <span class="">Customer Account</span>
      </div>
      <div class="w-10"></div>
    </div>

    <!-- Main Scrollable Content -->
    <main class="flex-1 px-6 pt-3 pb-6 flex flex-col justify-center">
      <!-- Brand Logo Header -->
      <div class="flex flex-col items-center text-center mb-5">
        <div class="w-16 h-16 bg-white rounded-2xl p-2.5 shadow-md shadow-red-500/10 border border-slate-100 flex items-center justify-center mb-2">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbR-nk3KH37RE2Qvq9YMclgIy3IP7x8bDAaSiVf0PP9QkB6TaDXIdLwZ1VUV6hkcOSK7jeXs3x7PIThGS7uH6TEUOpj2rDasAA-XR0o7UXtjdlAgrRdfPp5VToA5PFfPJdDJZTn4J3vozHnU3VKuI4syc7_vrzXxP-KFZ7z1Cr3elEnId5irpARFFkddevOZwuwt4yQ4DXro5TmEmY3kyCuAkoSHg9J5w7of9B-tIjqUO2dkrGrJJTqd4CUo1As9P3kA" alt="Speedy Meals Logo" class="w-full h-full object-contain">
        </div>
        <span class="text-[11px] font-black uppercase tracking-widest text-red-600 mb-0.5">Speedy Meals</span>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Your Account</h1>
        <p class="text-xs text-slate-500 mt-1 max-w-[280px]">Join Speedy Meals and get your favorite meals delivered</p>
      </div>

      <!-- Sign Up Form -->
      <form class="space-y-3" onsubmit="event.preventDefault();"><!-- Phone Number Field -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Phone Number</label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400 flex items-center gap-1">
              <i class="fa-solid fa-phone text-xs"></i>
            </span>
            <input type="tel" placeholder="+1 (555) 019-2834" class="w-full pl-11 pr-4 py-3 bg-slate-50/70 border border-slate-200 rounded-2xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/10 transition-all duration-200">
          </div>
        </div>

        <!-- Use email instead option -->
        <div class="text-right pt-0.5">
          <button type="button" class="text-xs font-semibold text-red-600 hover:text-red-700 hover:underline transition-colors">
            Use email instead
          </button>
        </div>

        <!-- Terms agreement -->
        <div class="flex items-start gap-2 pt-1 px-1">
          <input type="checkbox" id="terms" checked="" class="mt-0.5 w-4 h-4 rounded border-slate-300 text-red-600 focus:ring-red-500/30 accent-red-600">
          <label for="terms" class="text-[11px] text-slate-600 leading-tight">
            I agree to the <a href="#" class="text-red-600 font-semibold underline">Terms of Service</a> &amp; <a href="#" class="text-red-600 font-semibold underline">Privacy Policy</a>
          </label>
        </div>

        <!-- Primary CTA: Continue -->
        <button type="submit" class="w-full mt-2 py-4 px-6 bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-bold text-sm rounded-2xl shadow-lg shadow-red-600/30 hover:shadow-red-600/40 transition-all duration-200 flex items-center justify-center gap-2 group">
          <span class="">Continue</span>
          <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
        </button>

        <!-- Divider with OR -->
        <div class="relative flex items-center justify-center pt-2">
          <div class="border-t border-slate-200 w-full"></div>
          <span class="bg-white px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider absolute">OR</span>
        </div>

        <!-- Continue with Google Button -->
        <button type="button" class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 active:scale-[0.99] text-slate-700 font-semibold text-sm rounded-2xl shadow-sm transition-all duration-200 flex items-center justify-center gap-3">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
          </svg>
          <span class="">Continue with Google</span>
        </button></form>
    </main>

    <!-- Footer Switch to Login -->
    <footer class="p-5 pt-2 text-center border-t border-slate-100 bg-slate-50/50">
      <p class="text-xs text-slate-500 font-medium">
        Already have an account? 
        <a href="#" class="text-red-600 font-bold hover:text-red-700 hover:underline inline-flex items-center gap-1 ml-1">
          Login <i class="fa-solid fa-chevron-right text-[9px]"></i>
        </a>
      </p>
      <!-- Home Indicator -->
      <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div>
    </footer>

  </div>



</body></html>
