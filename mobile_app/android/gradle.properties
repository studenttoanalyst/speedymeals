# 4 GiB heap: the previous 8 GiB allocation crashed the daemon with an
# "insufficient memory ... G1 virtual space" JVM crash while R8 minified the
# release build (mobile_app/android/hs_err_*.log). 4 GiB is enough for R8 and
# fits on a 16 GB Windows machine with an emulator open.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
