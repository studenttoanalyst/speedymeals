<script>
  (function() {
    // Dynamic progressive initialization simulation for launch delightful micro-experience
    const statusMessages = [
      'Locating local top-rated kitchens...',
      'Matching hyper-local couriers nearby...',
      'Verifying flash deals and kitchen availability...',
      'Almost there, firing up your menu!'
    ];

    const progressBar = document.getElementById('splash-progress-bar');
    const progressCounter = document.getElementById('splash-progress-counter');
    const statusText = document.getElementById('splash-status-text');

    let currentPercent = 68;
    let stepIndex = 0;

    const interval = setInterval(() => {
      if (currentPercent < 98) {
        currentPercent += Math.floor(Math.random() * 6) + 3;
        if (currentPercent > 98) currentPercent = 98;
        if (progressBar) progressBar.style.width = currentPercent + '%';
        if (progressCounter) progressCounter.innerText = currentPercent + '%';

        // Rotate status text playfully
        if (currentPercent > 78 && stepIndex === 0) {
          stepIndex++;
          if (statusText) statusText.innerText = statusMessages[1];
        } else if (currentPercent > 88 && stepIndex === 1) {
          stepIndex++;
          if (statusText) statusText.innerText = statusMessages[2];
        } else if (currentPercent > 94 && stepIndex === 2) {
          stepIndex++;
          if (statusText) statusText.innerText = statusMessages[3];
        }
      } else {
        clearInterval(interval);
      }
    }, 450);
  })();
