<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedy Meals - Delivery Rider Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-900 min-h-screen flex justify-center items-center antialiased">
  <!-- Mobile Container -->
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col justify-between shadow-2xl relative overflow-hidden border-t-4 border-red-600">
    
    <!-- Top Status Bar Simulation -->
    <div class="pt-3 px-6 flex justify-between items-center text-xs font-semibold text-slate-700 select-none">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-[11px]"></i>
        <i class="fa-solid fa-wifi text-[11px]"></i>
        <i class="fa-solid fa-battery-full text-[13px]"></i>
      </div>
    </div>

    <!-- Header Navigation -->
    <div class="px-5 pt-3 flex items-center justify-between">
      <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-all duration-200 active:scale-95">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <div class="inline-flex items-center gap-1.5 bg-slate-900 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">
        <i class="fa-solid fa-motorcycle text-[11px] text-red-500"></i>
        <span>Rider Application</span>
      </div>
      <div class="w-10"></div>
    </div>

    <!-- Main Scrollable Content -->
    <main class="flex-1 px-6 pt-3 pb-6 flex flex-col justify-center overflow-y-auto">
      
      <!-- Brand & Rider Title -->
      <div class="flex flex-col items-center text-center mb-4">
        <div class="relative mb-2">
          <div class="w-16 h-16 bg-white rounded-2xl p-2.5 shadow-md border border-slate-100 flex items-center justify-center">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtbOU2OD_LV7zn04kZCWHLbJUqRGe8be4l-H4Rw9Ft2zTrLk8ubhOCIUxLPU8Ka1ulwwRHjxZkLuCxpL5sKArgM_L0DB0lfTX4tc2zhp0pLnvFtmO21qqjwyMzXy4eK3IynkBVxIIOPTiZ7zjNGuzkXbxsg3MYFP06NvNjml3f9b0xqO7b0ttQEEklAxEnBhlOhR0a1T2vF38TnhuM0bMsSLouUZtj-wuJYIlRpjo6ZRTgX0-djQ1MByTVjo957wGPCw" alt="Speedy Meals Logo" class="w-full h-full object-contain">
          </div>
          <!-- Rider Badge -->
          <div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-red-600 border-2 border-white shadow flex items-center justify-center overflow-hidden p-0.5">
            <img src="https://lh3.googleusercontent.com/aida/AEtjO1VFbHmPjd2SiE14_4NjODSM8DJAqGLeS71uCW-aaHdtgvdPNjpLGQkvOdYnuaqHV3f0Qp3cImpNQBXKzDB05xcZTJhAYtkbCEb7qxXFyETP_rPIfCdpzpFGK2DqTzHBG6S4M2cYCEmG2m5snqCZvIMbcJ0elmmHSTd5L4DBm-WSPvt9r3SJmlp_cX7ChPRKHWYsKNS0Vs3lcCEEjLf6aIDi5VF4KT0jIvE1cAHj09guFB3xtkpwaHCxYQ" alt="Rider Icon" class="w-full h-full object-contain">
          </div>
        </div>
        <span class="text-[11px] font-black uppercase tracking-widest text-red-600 mb-0.5">Speedy Meals Fleet</span>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Become a Delivery Rider</h1>
        <p class="text-xs text-slate-500 mt-1 max-w-[280px]">Join Speedy Meals and earn by delivering orders with flexible hours</p>
      </div>

      <!-- Registration Form -->
      <form class="space-y-3" onsubmit="event.preventDefault();">
        
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Full Name</label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400">
              <i class="fa-regular fa-user text-sm"></i>
            </span>
            <input 
              type="text" 
              placeholder="e.g. David Miller" 
              class="w-full pl-11 pr-4 py-2.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/10 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Email & Phone Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Email</label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400">
                <i class="fa-regular fa-envelope text-xs"></i>
              </span>
              <input 
                type="email" 
                placeholder="david@mail.com" 
                class="w-full pl-10 pr-3 py-2.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 transition-all"
              />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Phone Number</label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400">
                <i class="fa-solid fa-phone text-xs"></i>
              </span>
              <input 
                type="tel" 
                placeholder="+1 (555) 345-6789" 
                class="w-full pl-10 pr-3 py-2.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 transition-all"
              />
            </div>
          </div>
        </div>

        <!-- City Selection -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Operating City</label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400">
              <i class="fa-solid fa-location-dot text-sm"></i>
            </span>
            <select class="w-full pl-11 pr-8 py-2.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-800 focus:bg-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/10 transition-all appearance-none cursor-pointer">
              <option value="new_york">New York City, NY</option>
              <option value="los_angeles">Los Angeles, CA</option>
              <option value="chicago">Chicago, IL</option>
              <option value="houston">Houston, TX</option>
              <option value="miami">Miami, FL</option>
            </select>
            <span class="absolute right-4 text-slate-400 pointer-events-none">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </span>
          </div>
        </div>

        <!-- Vehicle Type Selector -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Vehicle Type</label>
          <div class="grid grid-cols-3 gap-2">
            <!-- Motorcycle -->
            <label class="cursor-pointer">
              <input type="radio" name="vehicle" value="motorcycle" checked class="peer sr-only">
              <div class="p-2.5 rounded-2xl border-2 border-slate-200 peer-checked:border-red-600 peer-checked:bg-red-50/50 flex flex-col items-center justify-center text-center transition-all">
                <i class="fa-solid fa-motorcycle text-lg text-slate-500 peer-checked:text-red-600 mb-1"></i>
                <span class="text-[11px] font-bold text-slate-700 peer-checked:text-red-700">Motorcycle</span>
              </div>
            </label>
            <!-- Car -->
            <label class="cursor-pointer">
              <input type="radio" name="vehicle" value="car" class="peer sr-only">
              <div class="p-2.5 rounded-2xl border-2 border-slate-200 peer-checked:border-red-600 peer-checked:bg-red-50/50 flex flex-col items-center justify-center text-center transition-all">
                <i class="fa-solid fa-car-side text-lg text-slate-500 peer-checked:text-red-600 mb-1"></i>
                <span class="text-[11px] font-bold text-slate-700 peer-checked:text-red-700">Car</span>
              </div>
            </label>
            <!-- Bicycle -->
            <label class="cursor-pointer">
              <input type="radio" name="vehicle" value="bicycle" class="peer sr-only">
              <div class="p-2.5 rounded-2xl border-2 border-slate-200 peer-checked:border-red-600 peer-checked:bg-red-50/50 flex flex-col items-center justify-center text-center transition-all">
                <i class="fa-solid fa-bicycle text-lg text-slate-500 peer-checked:text-red-600 mb-1"></i>
                <span class="text-[11px] font-bold text-slate-700 peer-checked:text-red-700">Bicycle</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Password & Confirm Password Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Password</label>
            <div class="relative flex items-center">
              <span class="absolute left-3 text-slate-400">
                <i class="fa-solid fa-lock text-xs"></i>
              </span>
              <input 
                id="riderPass1"
                type="password" 
                placeholder="Min 8 chars" 
                class="w-full pl-8 pr-8 py-2.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 transition-all"
              />
              <button 
                type="button" 
                onclick="const p = document.getElementById('riderPass1'); const icon = document.getElementById('eyeRider1'); if(p.type==='password'){p.type='text'; icon.classList.replace('fa-eye','fa-eye-slash');}else{p.type='password'; icon.classList.replace('fa-eye-slash','fa-eye');}" 
                class="absolute right-2.5 text-slate-400 hover:text-slate-600">
                <i id="eyeRider1" class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Confirm Password</label>
            <div class="relative flex items-center">
              <span class="absolute left-3 text-slate-400">
                <i class="fa-solid fa-lock text-xs"></i>
              </span>
              <input 
                id="riderPass2"
                type="password" 
                placeholder="Confirm password" 
                class="w-full pl-8 pr-8 py-2.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 transition-all"
              />
              <button 
                type="button" 
                onclick="const p = document.getElementById('riderPass2'); const icon = document.getElementById('eyeRider2'); if(p.type==='password'){p.type='text'; icon.classList.replace('fa-eye','fa-eye-slash');}else{p.type='password'; icon.classList.replace('fa-eye-slash','fa-eye');}" 
                class="absolute right-2.5 text-slate-400 hover:text-slate-600">
                <i id="eyeRider2" class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Rider Agreement Checkbox -->
        <div class="flex items-start gap-2 pt-1 px-1">
          <input type="checkbox" id="riderTerms" checked class="mt-0.5 w-4 h-4 rounded border-slate-300 text-red-600 focus:ring-red-500/30 accent-red-600">
          <label for="riderTerms" class="text-[11px] text-slate-600 leading-tight">
            I confirm I am 18+ and accept the <a href="#" class="text-red-600 font-semibold underline">Courier Partner Agreement</a> &amp; Background Check Policy.
          </label>
        </div>

        <!-- Primary Red CTA: Create Rider Account -->
        <button 
          type="submit" 
          class="w-full mt-2 py-4 px-6 bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-red-600/30 hover:shadow-red-600/40 transition-all duration-200 flex items-center justify-center gap-2 group">
          <i class="fa-solid fa-motorcycle text-sm"></i>
          <span>Create Rider Account</span>
          <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
        </button>
      </form>
    </main>

    <!-- Footer Switch to Login -->
    <footer class="p-5 pt-2 text-center border-t border-slate-100 bg-slate-50/50">
      <p class="text-xs text-slate-500 font-medium">
        Already have an account? 
        <a href="#" class="text-red-600 font-bold hover:text-red-700 hover:underline inline-flex items-center gap-1 ml-1">
          Login <i class="fa-solid fa-chevron-right text-[9px]"></i>
        </a>
      </p>
      <!-- Home Indicator -->
      <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div>
    </footer>

  </div>
</body>
</html>
