<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedy Meals - Delivery Rider Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-900 min-h-screen flex justify-center items-center antialiased">
  <!-- Mobile Container -->
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col justify-between shadow-2xl relative overflow-hidden border-t-4 border-red-600">
    
    <!-- Top Status Bar Simulation -->
    <div class="pt-3 px-6 flex justify-between items-center text-xs font-semibold text-slate-700 select-none">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-[11px]"></i>
        <i class="fa-solid fa-wifi text-[11px]"></i>
        <i class="fa-solid fa-battery-full text-[13px]"></i>
      </div>
    </div>

    <!-- Header Navigation with Rider Badge -->
    <div class="px-5 pt-3 flex items-center justify-between">
      <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-all duration-200 active:scale-95">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <div class="inline-flex items-center gap-1.5 bg-slate-900 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <i class="fa-solid fa-motorcycle text-[11px] text-red-500"></i>
        <span>Rider Fleet Portal</span>
      </div>
      <div class="w-10"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 px-6 pt-4 pb-6 flex flex-col justify-center">
      
      <!-- Brand & Rider Delivery Motif -->
      <div class="flex flex-col items-center text-center mb-6">
        <div class="relative mb-3">
          <div class="w-20 h-20 bg-white rounded-3xl p-3 shadow-md shadow-slate-200 border border-slate-100 flex items-center justify-center">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUxNcoKcFwJSxhvENbv0jIh2eXiJ-MqVChz7usF1DT3HT4NalLrxhGMy0LOb9hSy7H7miJuyhMw0eerR6OLlL-m63zDmHxyrM0ckjBgiIcoA8VhSOouCgF-EkL6HzbvxLHbdhFz60PUzX_YPhJV7vdIEG8ZKYzCsmctlLjyUnaMn_wAJpuiaiyUzqQX_UwQZscQ2_g15fgFy7VAx3GY6LjktQYAgLKG2y5WXh3DpR_ZmxUALaDh-H51saWHtfApNeZbw" alt="Speedy Meals Logo" class="w-full h-full object-contain">
          </div>
          <!-- Delivery Rider Icon Badge -->
          <div class="absolute -bottom-2 -right-2 w-9 h-9 rounded-full bg-red-600 border-2 border-white shadow-md flex items-center justify-center overflow-hidden p-1">
            <img src="https://lh3.googleusercontent.com/aida/AEtjO1VFbHmPjd2SiE14_4NjODSM8DJAqGLeS71uCW-aaHdtgvdPNjpLGQkvOdYnuaqHV3f0Qp3cImpNQBXKzDB05xcZTJhAYtkbCEb7qxXFyETP_rPIfCdpzpFGK2DqTzHBG6S4M2cYCEmG2m5snqCZvIMbcJ0elmmHSTd5L4DBm-WSPvt9r3SJmlp_cX7ChPRKHWYsKNS0Vs3lcCEEjLf6aIDi5VF4KT0jIvE1cAHj09guFB3xtkpwaHCxYQ" alt="Rider Icon" class="w-full h-full object-contain">
          </div>
        </div>

        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-amber-50 text-amber-700 text-[11px] font-bold border border-amber-200/60 mb-1">
          <i class="fa-solid fa-bolt text-[10px] text-amber-500"></i>
          <span>Partner App</span>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Welcome, Rider</h1>
        <p class="text-xs text-slate-500 mt-1 max-w-[260px]">Login to start delivering with Speedy Meals &amp; boost earnings</p>
      </div>

      <!-- Rider Quick Stats Strip -->
      <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200/80 mb-5 flex items-center justify-around">
        <div class="text-center">
          <p class="text-[10px] uppercase font-bold text-slate-400">Avg. Payout</p>
          <p class="text-xs font-black text-slate-800">$18-$26/hr</p>
        </div>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="text-center">
          <p class="text-[10px] uppercase font-bold text-slate-400">Flexibility</p>
          <p class="text-xs font-black text-slate-800">Instant Cashout</p>
        </div>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="text-center">
          <p class="text-[10px] uppercase font-bold text-slate-400">Incentive</p>
          <p class="text-xs font-black text-emerald-600">+100% Tips</p>
        </div>
      </div>

      <!-- Login Form -->
      <form class="space-y-4" onsubmit="event.preventDefault();">
        <!-- Email / Phone Field -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Rider ID, Email, or Phone</label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400">
              <i class="fa-solid fa-id-card text-xs"></i>
            </span>
            <input 
              type="text" 
              placeholder="e.g. rider@speedymeals.com or Phone" 
              value="rider.marcus@speedymeals.com"
              class="w-full pl-11 pr-4 py-3.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/10 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <div class="flex justify-between items-center mb-1.5 ml-1">
            <label class="text-xs font-bold text-slate-700">Password</label>
            <a href="#" class="text-xs font-semibold text-red-600 hover:text-red-700 hover:underline">Forgot Password?</a>
          </div>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </span>
            <input 
              id="riderPasswordInput"
              type="password" 
              value="fleetDrive2025" 
              placeholder="Enter your password"
              class="w-full pl-11 pr-11 py-3.5 bg-slate-50/70 border border-slate-200 rounded-2xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/10 transition-all duration-200"
            />
            <button 
              type="button" 
              onclick="const p = document.getElementById('riderPasswordInput'); const icon = document.getElementById('riderEyeIcon'); if(p.type==='password'){p.type='text'; icon.classList.replace('fa-eye','fa-eye-slash');}else{p.type='password'; icon.classList.replace('fa-eye-slash','fa-eye');}" 
              class="absolute right-3.5 p-1 text-slate-400 hover:text-slate-600 transition-colors">
              <i id="riderEyeIcon" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Primary Red CTA: Login -->
        <button 
          type="submit" 
          class="w-full mt-2 py-4 px-6 bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-red-600/30 hover:shadow-red-600/40 transition-all duration-200 flex items-center justify-center gap-2 group">
          <i class="fa-solid fa-motorcycle text-sm"></i>
          <span>Login &amp; Go Online</span>
          <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
        </button>
      </form>

      <!-- OR Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-[11px] uppercase font-bold text-slate-400 tracking-wider">
          <span class="bg-white px-4">OR</span>
        </div>
      </div>

      <!-- Google Option -->
      <button type="button" class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 border border-slate-200/90 rounded-2xl text-xs font-bold text-slate-700 flex items-center justify-center gap-3 shadow-sm hover:shadow transition-all duration-200 active:scale-[0.99]">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Fleet Helpdesk quick link -->
      <div class="mt-4 text-center">
        <a href="#" class="text-[11px] font-semibold text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-headset text-xs text-red-500"></i>
          <span>Rider Support &amp; Activation Helpline</span>
        </a>
      </div>
    </main>

    <!-- Footer Sign Up Prompt -->
    <footer class="p-6 pt-2 text-center border-t border-slate-100 bg-slate-50/50">
      <p class="text-xs text-slate-500 font-medium">
        Don't have a rider account? 
        <a href="#" class="text-red-600 font-bold hover:text-red-700 hover:underline inline-flex items-center gap-1 ml-1">
          Sign Up <i class="fa-solid fa-chevron-right text-[9px]"></i>
        </a>
      </p>
      <!-- Home Indicator -->
      <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div>
    </footer>

  </div>
</body>
</html>
